<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teknuro · Kanban</title>
  <meta name="description" content="Teknuro PowerTools Kanban board backed by GitHub Issues.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('teknuroKanbanPrefs') || '{}');
        if (prefs.theme === 'dark' || prefs.theme === 'light') {
          document.documentElement.setAttribute('data-theme', prefs.theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header>
    <div class="head">
      <a href="https://nuriensing.github.io/TeknuroPowerToolsKanban/" class="brand">
        <div class="logo">T</div>
        <div class="brand-text">
          <h1>Teknuro</h1><span class="sep">·</span><span class="word">Kanban</span>
        </div>
      </a>

      <nav class="tabs" id="tabs" aria-label="Issue filters">
        <button type="button" class="tab is-active" data-filter="all">
          <span class="lbl">All</span>
          <span class="num" id="tab-count-all">0</span>
        </button>
        <button type="button" class="tab" data-filter="open">
          <span class="lbl">Open</span>
          <span class="num" id="tab-count-open">0</span>
        </button>
        <button type="button" class="tab" data-filter="closed">
          <span class="lbl">Closed</span>
          <span class="num" id="tab-count-closed">0</span>
        </button>
      </nav>

      <div class="search" id="search">
        <span class="ico">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        </span>
        <input id="q" type="search" autocomplete="off" aria-label="Filter cards by text" placeholder="Filter cards…">
        <button class="clear" id="clear" aria-label="Clear search">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg>
        </button>
      </div>

      <button class="icobtn theme" id="theme" aria-label="Toggle light/dark theme">
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
      </button>

      <nav class="links">
        <a class="gh" href="https://github.com/NuriEnsing/TeknuroPowerToolsKanban" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.1.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.85-2.35 4.7-4.58 4.94.36.31.68.92.68 1.86v2.75c0 .27.18.59.69.48A10 10 0 0 0 12 2Z"/></svg>
          GitHub
        </a>
        <a class="web" href="https://teknuro.com" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 2.4 14.4 0 17M12 3.5c-2.4 2.6-2.4 14.4 0 17"/></svg>
          Website
        </a>
      </nav>
    </div>
  </header>

  <main id="board"></main>

  <footer>
    <span class="foot-txt">
      Teknuro PowerTools · public Kanban backed by GitHub Issues
      <span class="stamp" id="stamp" title="Last loaded"></span>
    </span>
    <span class="foot-links">
      <a href="https://github.com/NuriEnsing/TeknuroPowerToolsKanban/issues/new" target="_blank" rel="noopener noreferrer">Create issue</a>
    </span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
